<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050608"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>GPS Speed Dial</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#020304}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 45%,#16191d 0,#07090b 45%,#010203 100%);touch-action:manipulation}
body{display:grid;place-items:center}.app{width:100%;height:100%;display:grid;place-items:center;position:relative;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.gauge{position:relative;width:min(94vw,94vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#11151a 0 53%,#080a0d 54% 65%,#252a2f 66%,#050607 68% 71%,#343a40 72%,#090b0d 74%);box-shadow:0 0 60px #000,inset 0 0 35px #000}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.tick{stroke:#e9edf0;stroke-linecap:round}.minor{stroke:#7c838a}.num{fill:#e9edf0;font-weight:700;text-anchor:middle;dominant-baseline:middle}.redline{stroke:#e31c2b}
.needle{transform-origin:50% 50%;transform:rotate(-130deg);transition:transform .22s cubic-bezier(.2,.7,.3,1)}.needle line{stroke:#ed1b2f;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 4px #ff2639)}.needle circle{fill:#c8cdd1;stroke:#16191c;stroke-width:2}
.digital{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);text-align:center;min-width:32%;padding:.5rem 1rem;border:1px solid #343a40;border-radius:10px;background:linear-gradient(#080a0c,#15191d);box-shadow:inset 0 0 12px #000}
.speed{font:700 clamp(3rem,11vmin,7rem)/.85 "Arial Narrow",system-ui,sans-serif;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.unit{font-size:clamp(.7rem,2vmin,1rem);letter-spacing:.3em;color:#aeb5bb;margin-top:.55rem}
.status{position:absolute;top:4%;left:50%;transform:translateX(-50%);font-size:clamp(.65rem,1.6vmin,.9rem);letter-spacing:.12em;color:#8e969d;text-transform:uppercase;white-space:nowrap}
.hud{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:1px solid #606970;background:#15191dcc;color:white;font-size:22px;box-shadow:0 4px 18px #000;z-index:4}.hud.active{background:#7d101b;border-color:#ff5260}
.mirrored .gauge{transform:scaleX(-1)}.mirrored .hud{transform:none}
.start{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#030405e8}.start button{font:700 1rem system-ui;color:#fff;background:#a8101e;border:1px solid #ff4b59;border-radius:999px;padding:1rem 1.6rem}.start small{display:block;margin-top:.8rem;color:#9aa2a9;text-align:center}
.hidden{display:none}
@media(orientation:portrait){.gauge{width:min(96vw,80vh)}}
</style></head>
<body><main class="app" id="app"><section class="gauge" aria-label="GPS speedometer"><svg viewBox="0 0 100 100" id="dial" aria-hidden="true"></svg><div class="status" id="status">GPS READY</div><div class="digital"><div class="speed" id="speed">0</div><div class="unit">MPH</div></div></section><button class="hud" id="hud" aria-label="Mirror HUD mode" title="Mirror HUD">↔</button><div class="start" id="start"><div><button id="startBtn">START SPEEDOMETER</button><small>Uses your device GPS • no location is stored</small></div></div></main>
<script>
const NS="http://www.w3.org/2000/svg",dial=document.getElementById("dial"),speedEl=document.getElementById("speed"),statusEl=document.getElementById("status"),app=document.getElementById("app"),hud=document.getElementById("hud");
const cx=50,cy=50,r=41,start=-130,sweep=260;
function polar(a,r){let t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]}
for(let v=0;v<=120;v+=2){let major=v%10===0,a=start+sweep*v/120,[x1,y1]=polar(a,major?34.5:36.8),[x2,y2]=polar(a,40);let l=document.createElementNS(NS,"line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("class","tick "+(major?"":"minor")+(v>=100?" redline":""));l.setAttribute("stroke-width",major?1.15:.45);dial.appendChild(l);if(major){let [x,y]=polar(a,29.5),t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class","num");t.setAttribute("font-size",v===120?"4":"4.6");t.textContent=v;dial.appendChild(t)}}
let ng=document.createElementNS(NS,"g");ng.setAttribute("class","needle");ng.id="needle";ng.innerHTML='<line x1="50" y1="54" x2="50" y2="17"/><circle cx="50" cy="50" r="4.2"/><circle cx="50" cy="50" r="1.3" fill="#ed1b2f"/>';dial.appendChild(ng);
let shown=0,target=0,lastTs=0,watch=null;
function mph(ms){return Math.max(0,(ms||0)*2.2369362921)}
function render(ts){let dt=Math.min(0.08,(ts-lastTs)/1000||0);lastTs=ts;let k=1-Math.exp(-8*dt);shown+= (target-shown)*k;if(shown<.35&&target<.35)shown=0;document.getElementById("needle").style.transform='rotate('+(start+sweep*Math.min(120,shown)/120)+'deg)';requestAnimationFrame(render)}
requestAnimationFrame(render);
function update(p){let c=p.coords,raw=c.speed;if(raw==null&&window._lastPos){let d=distance(window._lastPos.coords,c),dt=(p.timestamp-window._lastPos.timestamp)/1000;if(dt>0)raw=d/dt}window._lastPos=p;target=Math.min(120,mph(raw));speedEl.textContent=Math.round(target);statusEl.textContent='GPS • ±'+Math.round(c.accuracy)+' m'}
function distance(a,b){let R=6371000,q1=a.latitude*Math.PI/180,q2=b.latitude*Math.PI/180,dq=(b.latitude-a.latitude)*Math.PI/180,dl=(b.longitude-a.longitude)*Math.PI/180,x=Math.sin(dq/2)**2+Math.cos(q1)*Math.cos(q2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function err(e){statusEl.textContent=e.code===1?'LOCATION PERMISSION NEEDED':'WAITING FOR GPS';target=0}
document.getElementById("startBtn").onclick=()=>{if(!navigator.geolocation){statusEl.textContent="GPS NOT AVAILABLE";return}document.getElementById("start").classList.add("hidden");statusEl.textContent="ACQUIRING GPS…";watch=navigator.geolocation.watchPosition(update,err,{enableHighAccuracy:true,maximumAge:500,timeout:12000});if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(screen.orientation?.lock)screen.orientation.lock("landscape").catch(()=>{})};
let mirrored=localStorage.getItem("hudMirror")==="1";function applyMirror(){app.classList.toggle("mirrored",mirrored);hud.classList.toggle("active",mirrored);hud.setAttribute("aria-pressed",String(mirrored))}applyMirror();hud.onclick=()=>{mirrored=!mirrored;localStorage.setItem("hudMirror",mirrored?"1":"0");applyMirror()};
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
